services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: molink-mysql
    restart: unless-stopped
    environment:
      # 敏感值通过 ${VAR:-默认值} 插值：默认值仅用于本地开发，生产环境在同目录 .env 中覆盖
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: molink_db
      MYSQL_USER: molink
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-molink_password}
    ports:
      # 仅绑定本机回环地址（仅本机访问；如需局域网访问，去掉 127.0.0.1: 前缀）
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      # $$ 转义为容器内环境变量引用，避免在 compose 文件中写明文密码
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - molink-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: molink-redis
    restart: unless-stopped
    environment:
      # 供 healthcheck 使用，与 command 中的 --requirepass 保持一致
      REDIS_PASSWORD: ${REDIS_PASSWORD:-molink_redis_dev}
    ports:
      # 仅绑定本机回环地址（仅本机访问；如需局域网访问，去掉 127.0.0.1: 前缀）
      - "127.0.0.1:16379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-molink_redis_dev}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - molink-network

  # FastAPI 后端
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # pip 镜像源加速（可选），在同目录 .env 中设置 PIP_INDEX_URL 生效
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: molink-backend
    restart: unless-stopped
    ports:
      # 后端 API 需对外提供访问，保持绑定所有网卡
      - "8000:8000"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=molink
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-molink_password}
      - MYSQL_DATABASE=molink_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-molink_redis_dev}
      - SECRET_KEY=${SECRET_KEY:-dev-only-secret-do-not-use-in-prod}
      - DEBUG=false
      # 本地开发播种默认管理员 admin@molink.local / admin123，生产务必覆盖
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 用镜像内置的 python 做探活（镜像已无 curl）
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - molink-network

volumes:
  mysql_data:
  redis_data:
  uploads_data:

networks:
  molink-network:
    driver: bridge
